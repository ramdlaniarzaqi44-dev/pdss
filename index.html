<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI ELI - Aplikasi Eligible Siswa</title>
    
    <style>
        #system-error-log { display: none; background: #fee2e2; color: #991b1b; padding: 20px; font-family: monospace; border-bottom: 2px solid #ef4444; z-index: 9999; position: relative; }
    </style>
    <script>
        window.onerror = function(msg, url, lineNo) {
            var log = document.getElementById('system-error-log');
            if (log) { log.style.display = 'block'; log.innerHTML += '<p><strong>[ERROR]</strong> ' + msg + ' (Baris ' + lineNo + ')</p>'; }
            return false; 
        };
    </script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    
    <!-- Tailwind CSS, SheetJS, ChartJS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.260.0/dist/umd/lucide.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { 
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, 
            getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, getDoc 
        };
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modern Table Styles */
        .modern-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .modern-table th { background-color: rgba(248, 250, 252, 0.8); backdrop-filter: blur(4px); color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; padding: 14px 16px; border-bottom: 1px solid #e2e8f0; }
        .modern-table td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; }
        .modern-table tbody tr { transition: all 0.2s ease; }
        .modern-table tbody tr:hover { background-color: #f8fafc; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); position: relative; z-index: 10; border-radius: 8px; }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="system-error-log"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="min-h-screen flex items-center justify-center bg-red-50 p-4">
                        <div className="bg-white p-6 rounded-2xl shadow-xl max-w-2xl w-full">
                            <h1 className="text-xl font-bold text-red-600 mb-2">Terjadi Kesalahan Aplikasi</h1>
                            <div className="bg-slate-900 text-green-400 p-4 rounded-xl text-xs font-mono overflow-auto max-h-64 mb-4">{this.state.error?.toString()}</div>
                            <button onClick={() => window.location.reload()} className="bg-red-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-red-700 transition-all">Muat Ulang Halaman</button>
                        </div>
                    </div>
                );
                return this.props.children;
            }
        }

        // --- ICON HELPER ---
        const createIcon = (iconName) => ({ size = 24, className = "", ...props }) => {
            if (!window.lucide || !window.lucide[iconName]) return <span className="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">{iconName}</span>;
            const iconNode = window.lucide[iconName];
            if (Array.isArray(iconNode) && iconNode[0] === 'svg') {
                const attrs = iconNode[1] || {}; const children = iconNode[2] || [];
                return React.createElement('svg', { ...attrs, width: size, height: size, className: className, ...props }, children.map((child, i) => React.createElement(child[0], { ...child[1], key: i })));
            }
            return <span className="text-[10px]">{iconName}</span>;
        };

        const Trophy = createIcon('Trophy'); const Users = createIcon('Users'); const BarChart3 = createIcon('BarChart3');
        const Plus = createIcon('Plus'); const Search = createIcon('Search'); const Trash2 = createIcon('Trash2');
        const Save = createIcon('Save'); const FileSpreadsheet = createIcon('FileSpreadsheet'); const X = createIcon('X'); 
        const BookOpen = createIcon('BookOpen'); const ClipboardPaste = createIcon('ClipboardPaste'); const FileUp = createIcon('FileUp');
        const AlertTriangle = createIcon('AlertTriangle'); const Download = createIcon('Download'); const CheckCircle = createIcon('CheckCircle');
        const UploadCloud = createIcon('UploadCloud'); const FileDown = createIcon('FileDown');
        const Award = createIcon('Award'); const Cloud = createIcon('Cloud');
        const Filter = createIcon('Filter'); const UserMinus = createIcon('UserMinus'); 
        const GraduationCap = createIcon('GraduationCap'); const Database = createIcon('Database'); const Trash = createIcon('Trash');
        const Menu = createIcon('Menu');
        const TrendingUp = createIcon('TrendingUp'); const TrendingDown = createIcon('TrendingDown');
        const Activity = createIcon('Activity'); const LineChart = createIcon('LineChart');

        const SEMESTERS = [
            { id: 1, label: 'Sem 1 (Kls 10)', level: 10 }, { id: 2, label: 'Sem 2 (Kls 10)', level: 10 },
            { id: 3, label: 'Sem 3 (Kls 11)', level: 11 }, { id: 4, label: 'Sem 4 (Kls 11)', level: 11 },
            { id: 5, label: 'Sem 5 (Kls 12)', level: 12 },
        ];

        const getBadgeClass = (trend) => {
            switch(trend) {
                case 'NAIK': return 'bg-emerald-100 text-emerald-700';
                case 'TURUN': return 'bg-red-100 text-red-700';
                case 'FLUKTUATIF': return 'bg-blue-100 text-blue-700';
                case 'STAGNAN': return 'bg-slate-200 text-slate-700';
                default: return 'bg-slate-100 text-slate-500';
            }
        };

        const Card = ({ title, value, icon, gradient }) => (
            <div className="glass-card p-6 rounded-3xl hover:-translate-y-1 transition-all duration-300 flex items-center space-x-5 group cursor-default">
                <div className={`p-4 rounded-2xl ${gradient} text-white shadow-lg group-hover:scale-110 transition-transform duration-300`}>
                    {icon}
                </div>
                <div>
                    <p className="text-xs text-slate-500 font-bold mb-1 uppercase tracking-widest">{title}</p>
                    <h3 className="text-4xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">{value}</h3>
                </div>
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-4xl" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
                    <div className={`bg-white rounded-[2rem] shadow-2xl w-full ${maxWidth} max-h-[90vh] overflow-hidden flex flex-col`}>
                        <div className="flex justify-between items-center p-8 border-b border-slate-100 bg-white/80 backdrop-blur-md z-10 flex-shrink-0">
                            <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2">{title}</h2>
                            <button type="button" onClick={onClose} className="p-2 bg-slate-100 hover:bg-red-100 hover:text-red-600 rounded-full transition-colors text-slate-500">
                                <X size={20} />
                            </button>
                        </div>
                        <div className="p-8 flex-1 overflow-y-auto bg-slate-50/50">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENT GRAFIK CHART.JS DINAMIS ---
        const ChartComponent = ({ student, graphMode, subjectAnalysis }) => {
            const chartRef = useRef(null);
            
            useEffect(() => {
                let chartInstance = null;
                if (chartRef.current && window.Chart && student) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    let semsData = [];
                    let labelName = "";
                    let color = "#4f46e5"; // Indigo default
                    let bgColor = "rgba(79, 70, 229, 0.15)";
                    
                    if (graphMode === 'AVERAGE') {
                        semsData = [1,2,3,4,5].map(i => student.stats.sems[i].avg !== "-" ? parseFloat(student.stats.sems[i].avg) : null);
                        labelName = "Rata-rata Keseluruhan";
                    } else {
                        const sub = subjectAnalysis.find(s => s.name === graphMode);
                        if (sub) {
                            semsData = [1,2,3,4,5].map(i => sub.sems[i] !== "-" ? sub.sems[i] : null);
                            labelName = `Nilai ${graphMode}`;
                            color = "#059669"; // Emerald for subject view
                            bgColor = "rgba(5, 150, 105, 0.15)";
                        }
                    }
                    
                    chartInstance = new window.Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4', 'Sem 5'],
                            datasets: [{
                                label: labelName,
                                data: semsData,
                                borderColor: color,
                                backgroundColor: bgColor,
                                borderWidth: 3,
                                pointBackgroundColor: '#fff',
                                pointBorderColor: color,
                                pointBorderWidth: 2,
                                pointRadius: 6,
                                pointHoverRadius: 8,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    suggestedMin: 70,
                                    suggestedMax: 100
                                }
                            }
                        }
                    });
                }
                return () => { if (chartInstance) chartInstance.destroy(); }
            }, [student, graphMode, subjectAnalysis]);

            return <div className="w-full h-64 relative"><canvas ref={chartRef}></canvas></div>;
        };

        const App = () => {
            const [user, setUser] = useState(null); const [db, setDb] = useState(null); const [appId, setAppId] = useState(null);
            const [isOnline, setIsOnline] = useState(false); const [loading, setLoading] = useState(true);

            const [students, setStudents] = useState([]);
            const [subjects, setSubjects] = useState([]);
            const [rejectedStudents, setRejectedStudents] = useState([]);

            const [view, setView] = useState('dashboard'); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSubjectModalOpen, setIsSubjectModalOpen] = useState(false);
            
            const [isGraphModalOpen, setIsGraphModalOpen] = useState(false);
            const [selectedGraphStudent, setSelectedGraphStudent] = useState(null);
            const [selectedGraphSubject, setSelectedGraphSubject] = useState('AVERAGE'); // AVERAGE or Subject Name

            const [editingStudent, setEditingStudent] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [activeSemesterInput, setActiveSemesterInput] = useState(1);
            const [pasteMode, setPasteMode] = useState(false);
            const [importSemester, setImportSemester] = useState(1); 
            const [eligibleQuota, setEligibleQuota] = useState(25);
            
            const [rankFilter, setRankFilter] = useState('ALL');
            const [eligibleFilter, setEligibleFilter] = useState('ALL');
            const [rejectSearch, setRejectSearch] = useState(""); const [rejectReason, setRejectReason] = useState("");
            const [selectedRejectStudent, setSelectedRejectStudent] = useState(null);
            const [currentGrades, setCurrentGrades] = useState({});

            // State Analisis Tren
            const [trendSearch, setTrendSearch] = useState("");
            const [trendFilter, setTrendFilter] = useState("ALL");

            const [importStage, setImportStage] = useState('upload'); 
            const [previewData, setPreviewData] = useState([]); 
            const [importStats, setImportStats] = useState({ updated: 0, new: 0 });
            
            const [newSubjectName, setNewSubjectName] = useState("");
            const [activeLevelTab, setActiveLevelTab] = useState(10); 
            
            // Checkbox States
            const [selectedStudents, setSelectedStudents] = useState([]);
            const [selectedSubjects, setSelectedSubjects] = useState([]);

            useEffect(() => {
                const initFirebase = async () => {
                    let attempts = 0;
                    const checkModules = setInterval(async () => {
                        attempts++;
                        if (window.firebaseModules) {
                            clearInterval(checkModules);
                            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore } = window.firebaseModules;
                            try {
                                const firebaseConfig = { apiKey: "AIzaSyAN-g1GD_vFpO6sZAKyJ6WrZC0lTXQaxcc", authDomain: "pdss-bk.firebaseapp.com", projectId: "pdss-bk", storageBucket: "pdss-bk.firebasestorage.app", messagingSenderId: "755442420988", appId: "1:755442420988:web:28a274042fc7b77a5a9b79" };
                                const app = initializeApp(firebaseConfig); const auth = getAuth(app); const firestore = getFirestore(app);
                                setDb(firestore); setAppId('sieli-app-v2');
                                try { await signInAnonymously(auth); } catch (e) { }
                                onAuthStateChanged(auth, (u) => { setUser(u); setIsOnline(!!u); });
                            } catch (error) { setLoading(false); }
                        } else if (attempts > 50) { clearInterval(checkModules); setLoading(false); }
                    }, 100);
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (!user || !db || !appId || typeof window.firebaseModules === 'undefined') return;
                const { collection, onSnapshot } = window.firebaseModules;
                
                const subRef = collection(db, 'artifacts', appId, 'public', 'data', 'subjects_v1');
                const unsubSub = onSnapshot(subRef, (snapshot) => {
                    const loadedSubjects = snapshot.docs.map(d => d.data());
                    loadedSubjects.sort((a, b) => (a.order || 99) - (b.order || 99)); 
                    setSubjects(loadedSubjects);
                }, () => setLoading(false));

                const stuRef = collection(db, 'artifacts', appId, 'public', 'data', 'students_v1');
                const unsubStu = onSnapshot(stuRef, (snapshot) => {
                    const loadedStudents = snapshot.docs.map(d => d.data());
                    setStudents(loadedStudents);
                    setLoading(false);
                }, () => setLoading(false));

                const rejRef = collection(db, 'artifacts', appId, 'public', 'data', 'rejected_students_v1');
                const unsubRej = onSnapshot(rejRef, (snapshot) => { setRejectedStudents(snapshot.docs.map(d => d.data())); });

                return () => { unsubSub(); unsubStu(); unsubRej(); };
            }, [user, db, appId]);

            useEffect(() => {
                if (isModalOpen) {
                    if (editingStudent) setCurrentGrades(JSON.parse(JSON.stringify(editingStudent.grades || {})));
                    else setCurrentGrades({});
                }
            }, [isModalOpen, editingStudent]);

            const updateCurrentGrades = (semId, subId, value) => {
                setCurrentGrades(prev => { const semGrades = { ...(prev[semId] || {}) }; semGrades[subId] = parseInt(value) || 0; return { ...prev, [semId]: semGrades }; });
            };

            const dbSaveStudent = async (data) => { if(db) await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'students_v1', String(data.id)), data); };
            const dbDeleteStudent = async (id) => { if(db) await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'students_v1', String(id))); };
            const dbSaveSubject = async (data) => { if(db) await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'subjects_v1', data.id), data); };
            const dbDeleteSubject = async (id) => { if(db) await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'subjects_v1', id)); };
            const dbSaveRejection = async (data) => { if(db) await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'rejected_students_v1', String(data.studentId)), data); };
            const dbDeleteRejection = async (id) => { if(db) await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'rejected_students_v1', String(id))); };

            const handleAddSubject = (e) => {
                e.preventDefault(); if (!newSubjectName.trim()) return;
                const id = newSubjectName.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 10) + Date.now().toString().slice(-3);
                const existing = subjects.find(s => s.name.toLowerCase() === newSubjectName.toLowerCase());
                const nextOrder = subjects.reduce((max, s) => (s.order > max ? s.order : max), 0) + 1;
                if (existing) { if (!existing.levels.includes(activeLevelTab)) dbSaveSubject({ ...existing, levels: [...existing.levels, activeLevelTab] }); }
                else dbSaveSubject({ id, name: newSubjectName, levels: [activeLevelTab], order: nextOrder });
                setNewSubjectName("");
            };
            const handleUpdateSubjectOrder = async (subject, newVal) => { const val = parseInt(newVal); if (!isNaN(val) && subject.order !== val) await dbSaveSubject({ ...subject, order: val }); };
            const getSubjectsByLevel = (level) => subjects.filter(s => s.levels.includes(level)).sort((a, b) => (a.order || 99) - (b.order || 99));

            const dbDeleteSubjectFromLevel = async (subjectId, level) => {
                const subject = subjects.find(s => s.id === subjectId);
                if (!subject) return;
                const newLevels = subject.levels.filter(l => l !== level);
                if (newLevels.length === 0) {
                    await dbDeleteSubject(subjectId);
                } else {
                    await dbSaveSubject({ ...subject, levels: newLevels });
                }
            };
            const handleDeleteSubjectFromLevel = async (id, level) => {
                if(confirm("Hapus mapel ini dari kelas " + level + "?")) {
                    setLoading(true);
                    try { await dbDeleteSubjectFromLevel(id, level); }
                    catch(e) { alert(e.message); } finally { setLoading(false); }
                }
            };
            const handleSelectSubject = (id) => setSelectedSubjects(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            const handleSelectAllSubjects = (e, list) => { if(e.target.checked) setSelectedSubjects(list.map(s => s.id)); else setSelectedSubjects([]); };
            const handleBulkDeleteSubjects = async () => {
                if(confirm(`Yakin ingin menghapus ${selectedSubjects.length} mapel terpilih dari Kelas ${activeLevelTab}?`)) {
                    setLoading(true);
                    try {
                        for(const id of selectedSubjects) { await dbDeleteSubjectFromLevel(id, activeLevelTab); }
                        setSelectedSubjects([]);
                    } catch (e) { alert(e.message); } finally { setLoading(false); }
                }
            };
            
            // =========================================================================
            // CORE CALCULATION ENGINE - TREND RATA-RATA GLOBAL
            // =========================================================================
            const processedStudents = useMemo(() => {
                return students.map(student => {
                    let grandTotal = 0;
                    let grandCount = 0;
                    const sems = {};

                    SEMESTERS.forEach(sem => {
                        let semTotal = 0;
                        let semCount = 0;
                        getSubjectsByLevel(sem.level).forEach(sub => {
                            const val = parseInt(student.grades?.[sem.id]?.[sub.id], 10) || 0;
                            if (val > 0) {
                                semTotal += val;
                                semCount++;
                                grandTotal += val;
                                grandCount++;
                            }
                        });
                        sems[sem.id] = { total: semTotal, avg: semCount > 0 ? (semTotal / semCount).toFixed(2) : "-" };
                    });

                    // Trend Global
                    let trend = "BELUM LENGKAP";
                    const semsArr = [sems[1].avg, sems[2].avg, sems[3].avg, sems[4].avg, sems[5].avg];
                    const validAvgs = [];
                    semsArr.forEach((avg, idx) => { if (avg !== "-") validAvgs.push({ sem: idx + 1, val: parseFloat(avg) }); });
                    
                    if (validAvgs.length >= 2) {
                        let naik = true; let turun = true; let same = true;
                        for (let i = 1; i < validAvgs.length; i++) {
                            if (validAvgs[i].val < validAvgs[i-1].val) naik = false;
                            if (validAvgs[i].val > validAvgs[i-1].val) turun = false;
                            if (validAvgs[i].val !== validAvgs[i-1].val) same = false;
                        }
                        if (same) trend = "STAGNAN";
                        else if (naik) trend = "NAIK";
                        else if (turun) trend = "TURUN";
                        else trend = "FLUKTUATIF";
                    }

                    return { ...student, stats: { sems, grandTotal, grandAvg: grandCount > 0 ? (grandTotal / grandCount).toFixed(2) : "0.00", trend } };
                });
            }, [students, subjects]);

            // =========================================================================
            // CORE CALCULATION ENGINE - TREND SPESIFIK PER MATA PELAJARAN (UNTUK MODAL)
            // =========================================================================
            const subjectAnalysisData = useMemo(() => {
                if (!selectedGraphStudent) return [];
                const subjectMap = {};
                
                [1,2,3,4,5].forEach(sem => {
                    const semGrades = selectedGraphStudent.grades?.[sem] || {};
                    Object.keys(semGrades).forEach(subId => {
                        const val = parseInt(semGrades[subId]) || 0;
                        if (val > 0) {
                            const subDef = subjects.find(s => s.id === subId);
                            if (subDef) {
                                const name = subDef.name.toUpperCase();
                                if (!subjectMap[name]) subjectMap[name] = { 1: "-", 2: "-", 3: "-", 4: "-", 5: "-" };
                                subjectMap[name][sem] = val;
                            }
                        }
                    });
                });

                return Object.keys(subjectMap).map(name => {
                    const sems = subjectMap[name];
                    const validVals = [sems[1], sems[2], sems[3], sems[4], sems[5]].filter(v => v !== "-").map(Number);
                    
                    let trend = "BELUM LENGKAP";
                    if (validVals.length >= 2) {
                        let naik = true; let turun = true; let same = true;
                        for (let i = 1; i < validVals.length; i++) {
                            if (validVals[i] < validVals[i-1]) naik = false;
                            if (validVals[i] > validVals[i-1]) turun = false;
                            if (validVals[i] !== validVals[i-1]) same = false;
                        }
                        if (same) trend = "STAGNAN";
                        else if (naik) trend = "NAIK";
                        else if (turun) trend = "TURUN";
                        else trend = "FLUKTUATIF";
                    }
                    return { name, sems, trend };
                }).sort((a, b) => a.name.localeCompare(b.name));
            }, [selectedGraphStudent, subjects]);

            const uniqueClasses = useMemo(() => [...new Set(processedStudents.map(s => s.class).filter(Boolean).map(c => c.trim().toUpperCase()))].sort(), [processedStudents]);
            const getProcessedRankings = (filterClass) => {

                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl"><GraduationCap size={20}/></div>
                                <span className="font-extrabold text-xl tracking-tight">SI ELI</span>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors">
                                {isMobileMenuOpen ? <X size={20}/> : <Menu size={20}/>}
                            </button>
                        </div>
                        
                        {/* Dropdown Menu Mobile */}
                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-[#0f172a] border-b border-slate-800 px-4 py-4 shadow-2xl absolute w-full z-20 flex flex-col gap-2 top-[76px]">
                                {[{ id: 'dashboard', label: 'Dasbor Utama', icon: BarChart3 }, { id: 'input', label: 'Data Siswa', icon: FileSpreadsheet }, { id: 'analysis', label: 'Analisis Tren', icon: TrendingUp }, { id: 'rankings', label: 'Peringkat', icon: Trophy }, { id: 'eligible', label: 'Siswa Eligible', icon: Award }, { id: 'rejected', label: 'Tolak Eligible', icon: UserMinus }, { id: 'management', label: 'Import & Manajemen', icon: Database }].map(item => {
                                    const Icon = item.icon; const isActive = view === item.id;
                                    return (
                                        <button key={item.id} onClick={() => { setView(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${isActive ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>
                                            <Icon size={18} className={isActive ? "text-white" : "text-slate-400"}/> {item.label}
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto p-5 md:p-10 relative z-10 scroll-smooth flex flex-col">
                            {/* MAIN CONTENT VIEWS */}
                            <div className="flex-1">
                                {view === 'dashboard' && renderDashboard()}
                                {view === 'input' && renderDataInput()}
                                {view === 'analysis' && renderAnalysis()}
                                {view === 'rankings' && renderRankings()}
                                {view === 'eligible' && renderEligible()}
                                {view === 'rejected' && renderRejectedMenu()}
                                {view === 'management' && renderManagement()}
                            </div>
                            
                            {/* MAIN FOOTER (COPYRIGHT) */}
                            <div className="mt-12 pt-6 border-t border-slate-200/60 text-center w-full shrink-0">
                                <p className="text-[11px] font-extrabold text-slate-400 tracking-widest uppercase">
                                    &copy; {new Date().getFullYear()} Copyright Aplikasi <span className="text-indigo-500">TIM BK Anti Sambat</span> SMAS Al-Multazam
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* MODAL GRAFIK & ANALISIS MAPEL */}
                    <Modal isOpen={isGraphModalOpen} onClose={()=>setIsGraphModalOpen(false)} title="Grafik & Analisis Nilai">
                        {selectedGraphStudent && (
                            <div className="space-y-6">
                                {/* Header Data Siswa */}
                                <div className="flex flex-col md:flex-row justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-100 gap-4">
                                    <div className="text-center md:text-left">
                                        <h4 className="font-extrabold text-slate-800 text-lg">{selectedGraphStudent.name}</h4>
                                        <p className="text-sm font-mono text-slate-500 mt-1">{selectedGraphStudent.nis} • Kelas {selectedGraphStudent.class}</p>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Kesimpulan Rata-Rata Global</div>
                                        <span className={`px-4 py-2 rounded-xl text-sm font-extrabold tracking-widest shadow-sm inline-block ${getBadgeClass(selectedGraphStudent.stats.trend)}`}>
                                            TREN: {selectedGraphStudent.stats.trend}
                                        </span>
                                    </div>
                                </div>
                                
                                {/* Area Grafik Dinamis */}
                                <div className="p-4 md:p-6 bg-white border border-slate-100 rounded-[2rem] shadow-sm">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                        <h4 className="font-extrabold text-slate-700 flex items-center gap-2"><LineChart size={18} className="text-indigo-600"/> Tampilan Grafik</h4>
                                        <select value={selectedGraphSubject} onChange={(e)=>setSelectedGraphSubject(e.target.value)} className="bg-slate-50 border border-slate-200 text-sm font-bold text-indigo-700 py-2.5 px-4 rounded-xl focus:ring-2 focus:ring-indigo-500 shadow-inner w-full md:w-auto cursor-pointer">
                                            <option value="AVERAGE">Grafik Rata-rata Keseluruhan</option>
                                            {subjectAnalysisData.map(s => <option key={s.name} value={s.name}>Mapel: {s.name}</option>)}
                                        </select>
                                    </div>
                                    
                                    <ChartComponent student={selectedGraphStudent} graphMode={selectedGraphSubject} subjectAnalysis={subjectAnalysisData} />
                                </div>
                                
                                {/* Angka Semester Dinamis (Menyesuaikan Grafik) */}
                                <div className="grid grid-cols-5 gap-2 md:gap-4 text-center">
                                    {[1,2,3,4,5].map(sem => {
                                        let displayVal = "-";
                                        if (selectedGraphSubject === 'AVERAGE') {
                                            displayVal = selectedGraphStudent.stats.sems[sem].avg;
                                        } else {
                                            const sub = subjectAnalysisData.find(s => s.name === selectedGraphSubject);
                                            if (sub) displayVal = sub.sems[sem];
                                        }
                                        return (
                                            <div key={sem} className="bg-slate-50 p-3 rounded-2xl border border-slate-100 shadow-sm transition-all">
                                                <div className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Sem {sem}</div>
                                                <div className="font-extrabold text-indigo-600 text-sm md:text-xl">{displayVal}</div>
                                            </div>
                                        )
                                    })}
                                </div>

                                {/* Analisis Detail Per Mata Pelajaran (Tabel Bawah) */}
                                <div className="mt-8 border-t border-slate-100 pt-8">
                                    <div className="flex justify-between items-end mb-4">
                                        <div>
                                            <h4 className="font-extrabold text-slate-800 text-lg flex items-center gap-2"><BookOpen className="text-indigo-600"/> Rincian Tren Per-Mapel</h4>
                                            <p className="text-xs text-slate-500 mt-1">Klik baris di bawah ini untuk melihat garis grafiknya di atas.</p>
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto rounded-2xl border border-slate-100 shadow-inner bg-white">
                                        <table className="modern-table text-sm">
                                            <thead className="bg-slate-50">
                                                <tr>
                                                    <th>Mata Pelajaran</th>
                                                    <th className="text-center">S1</th>
                                                    <th className="text-center">S2</th>
                                                    <th className="text-center">S3</th>
                                                    <th className="text-center">S4</th>
                                                    <th className="text-center">S5</th>
                                                    <th className="text-center">Tren Nilai</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {subjectAnalysisData.map((item, idx) => (
                                                    <tr key={idx} onClick={() => setSelectedGraphSubject(item.name)} className={`cursor-pointer transition-colors ${selectedGraphSubject === item.name ? 'bg-indigo-50/70 border-l-4 border-l-indigo-500' : 'hover:bg-slate-50'}`}>
                                                        <td className="font-bold text-slate-700">{item.name}</td>
                                                        {[1,2,3,4,5].map(sem => (
                                                            <td key={sem} className={`text-center font-mono ${item.sems[sem] === "-" ? 'text-slate-300' : 'text-slate-600 font-bold'}`}>
                                                                {item.sems[sem]}
                                                            </td>
                                                        ))}
                                                        <td className="text-center">
                                                            <span className={`px-2 py-1 rounded-md text-[10px] font-extrabold tracking-widest ${getBadgeClass(item.trend)}`}>{item.trend}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {subjectAnalysisData.length === 0 && (
                                                    <tr><td colSpan="7" className="p-8 text-center text-slate-400 italic">Siswa ini belum memiliki nilai mata pelajaran yang terisi.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        )}
                    </Modal>
                    
                    {/* Modal Input Siswa */}
                    <Modal isOpen={isModalOpen} onClose={()=>setIsModalOpen(false)} title="Formulir Data Siswa">
                        <form onSubmit={handleSaveStudent} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div><label className="text-xs font-bold text-slate-500 mb-2 block uppercase tracking-widest">NIS</label><input required name="nis" defaultValue={editingStudent?.nis} className="w-full border-none shadow-sm p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-mono text-sm font-bold" /></div>
                                <div><label className="text-xs font-bold text-slate-500 mb-2 block uppercase tracking-widest">NISN</label><input name="nisn" defaultValue={editingStudent?.nisn} className="w-full border-none shadow-sm p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-mono text-sm font-bold" /></div>
                                <div className="md:col-span-2"><label className="text-xs font-bold text-slate-500 mb-2 block uppercase tracking-widest">Nama Lengkap</label><input required name="name" defaultValue={editingStudent?.name} className="w-full border-none shadow-sm p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-base font-extrabold text-slate-800" /></div>
                                <div className="md:col-span-2"><label className="text-xs font-bold text-slate-500 mb-2 block uppercase tracking-widest">Kelas Akhir (Jenjang 12)</label><input required name="class" defaultValue={editingStudent?.class} placeholder="Contoh: 12 IPA 1" className="w-full border-none shadow-sm p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-base font-bold text-slate-800" /></div>
                            </div>
                            
                            <div className="pt-6 border-t border-slate-100">
                                <h4 className="font-extrabold text-slate-800 mb-4 flex items-center gap-2 text-lg"><FileSpreadsheet className="text-indigo-500" size={20}/> Input Nilai Rapor Manual</h4>
                                <div className="flex overflow-x-auto bg-slate-100 p-1.5 rounded-2xl mb-6 shadow-inner">
                                    {SEMESTERS.map(s => (
                                        <button key={s.id} type="button" onClick={()=>setActiveSemesterInput(s.id)} className={`px-5 py-2.5 whitespace-nowrap text-sm font-extrabold rounded-xl transition-all ${activeSemesterInput===s.id ? 'bg-white shadow-md text-indigo-600 scale-105':'text-slate-500 hover:text-slate-800 hover:bg-slate-200'}`}>{s.label}</button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-5">
                                    {getSubjectsByLevel(SEMESTERS.find(s=>s.id===activeSemesterInput).level).map(sub => (
                                        <div key={`${activeSemesterInput}_${sub.id}`} className="bg-slate-50 p-3 rounded-2xl border border-slate-100 shadow-sm">
                                            <label className="text-xs font-extrabold text-slate-500 mb-2 block truncate text-center uppercase tracking-widest">{sub.name}</label>
                                            <input type="number" min="0" max="100" value={currentGrades[activeSemesterInput]?.[sub.id] || 0} onChange={(e) => updateCurrentGrades(activeSemesterInput, sub.id, e.target.value)} className="w-full border-none p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white text-center font-extrabold text-indigo-700 text-lg shadow-inner" />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-col-reverse md:flex-row justify-between items-center pt-8 border-t border-slate-100 gap-4 mt-6">
                                <button type="button" onClick={()=>setPasteMode(!pasteMode)} className="text-sm font-extrabold text-emerald-600 hover:text-emerald-700 flex items-center gap-1 bg-emerald-50 px-4 py-2 rounded-xl transition-colors"><ClipboardPaste size={16}/> Mode Tempel Cepat (Excel)</button>
                                <div className="flex gap-3 w-full md:w-auto">
                                    <button type="button" onClick={()=>setIsModalOpen(false)} className="flex-1 md:flex-none px-6 py-3.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">Batalkan</button>
                                    <button type="submit" className="flex-1 md:flex-none bg-indigo-600 text-white px-8 py-3.5 rounded-xl font-extrabold hover:bg-indigo-700 hover:-translate-y-0.5 shadow-xl shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-base"><Save size={18}/> Simpan Perubahan</button>
                                </div>
                            </div>
                            
                            {pasteMode && (
                                <div className="p-5 bg-emerald-50 border border-emerald-100 rounded-2xl animate-fade-in mt-4 shadow-sm">
                                    <p className="text-xs mb-3 text-emerald-800 font-bold tracking-wide">PASTE BARIS NILAI DARI EXCEL (Urutan harus sama persis dengan kotak di atas):</p>
                                    <div className="flex gap-3">
                                        <input id="pasteInput" className="flex-1 border-none shadow-inner p-3 rounded-xl text-sm font-mono focus:ring-2 focus:ring-emerald-500 bg-white" placeholder="Contoh: 80 85 90 92 ..."/>
                                        <button type="button" onClick={()=>{ handlePasteData(document.getElementById('pasteInput').value, activeSemesterInput, getSubjectsByLevel(SEMESTERS.find(s=>s.id===activeSemesterInput).level)); }} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 rounded-xl text-sm font-extrabold transition-all shadow-md shadow-emerald-600/20 hover:-translate-y-0.5">Terapkan Nilai</button>
                                    </div>
                                </div>
                            )}
                        </form>
                    </Modal>

                    {/* Modal Mapel */}
                    <Modal isOpen={isSubjectModalOpen} onClose={()=>setIsSubjectModalOpen(false)} title="Pengaturan Mata Pelajaran">
                        <div className="space-y-6">
                            
                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-2">
                                <div>
                                    <h4 className="font-extrabold text-sm text-slate-700">Import Massal Mapel (Excel)</h4>
                                    <p className="text-xs text-slate-500">Unduh template, isi, lalu upload sesuai kelas.</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handleDownloadSubjectTemplate} className="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-xs font-bold shadow-sm flex items-center gap-2 hover:bg-slate-50"><Download size={14}/> Template</button>
                                    <label className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-indigo-700 flex items-center gap-2 cursor-pointer transition-colors">
                                        <UploadCloud size={14}/> Upload Excel
                                        <input type="file" onChange={handleSubjectFileUpload} className="hidden"/>
                                    </label>
                                </div>
                            </div>

                            <div className="flex bg-slate-100 p-1.5 rounded-2xl shadow-inner mt-4">
                                {[10,11,12].map(l => (
                                    <button key={l} onClick={() => { setActiveLevelTab(l); setSelectedSubjects([]); }} className={`flex-1 py-2.5 text-sm font-extrabold rounded-xl transition-all ${activeLevelTab===l?'bg-white shadow-md text-indigo-600 scale-105':'text-slate-500 hover:bg-slate-200'}`}>Kelas {l}</button>
                                ))}
                            </div>

                            <form onSubmit={handleAddSubject} className="flex gap-3">
                                <input required value={newSubjectName} onChange={e=>setNewSubjectName(e.target.value)} placeholder="Ketik nama mata pelajaran baru..." className="border-none shadow-sm p-4 rounded-2xl flex-1 text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-bold text-slate-800"/>
                                <button className="bg-indigo-600 text-white px-8 rounded-2xl text-sm font-extrabold hover:bg-indigo-700 shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2 hover:-translate-y-0.5"><Plus size={18}/> Tambah Mapel</button>
                            </form>
                            
                            <div className="bg-slate-50 rounded-2xl border border-slate-100 p-2 shadow-inner">
                                <div className="flex justify-between items-center mb-2 px-3 pt-2">
                                    <div className="flex items-center gap-3">
                                        <input type="checkbox" className="w-4 h-4 cursor-pointer accent-indigo-600" 
                                            checked={getSubjectsByLevel(activeLevelTab).length > 0 && selectedSubjects.length === getSubjectsByLevel(activeLevelTab).length}
                                            onChange={(e) => handleSelectAllSubjects(e, getSubjectsByLevel(activeLevelTab))}
                                        />
                                        <span className="text-xs font-bold text-slate-500 uppercase tracking-widest">Pilih Semua</span>
                                    </div>
                                    {selectedSubjects.length > 0 && (
                                        <button onClick={handleBulkDeleteSubjects} type="button" className="bg-red-100 text-red-600 hover:bg-red-500 hover:text-white px-4 py-1.5 rounded-lg text-xs font-extrabold flex items-center gap-2 transition-colors">
                                            <Trash2 size={14}/> Hapus ({selectedSubjects.length}) Mapel
                                        </button>
                                    )}
                                </div>
                                
                                <div className="max-h-[250px] overflow-y-auto pr-2 space-y-2 pb-2">
                                    {getSubjectsByLevel(activeLevelTab).map((s, i) => (
                                        <div key={s.id} className={`flex justify-between p-3.5 border rounded-2xl items-center bg-white shadow-sm group hover:shadow-md transition-all hover:-translate-y-0.5 ${selectedSubjects.includes(s.id) ? 'border-indigo-300 ring-2 ring-indigo-50' : 'border-slate-100'}`}>
                                            <div className="flex items-center gap-4 flex-1">
                                                <input type="checkbox" className="w-4 h-4 cursor-pointer accent-indigo-600"
                                                    checked={selectedSubjects.includes(s.id)}
                                                    onChange={() => handleSelectSubject(s.id)}
                                                />
                                                <div className="flex flex-col items-center justify-center bg-slate-50 p-1.5 rounded-xl border border-slate-100">
                                                    <span className="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">No.Urut</span>
                                                    <input type="number" defaultValue={s.order} onBlur={(e) => handleUpdateSubjectOrder(s, e.target.value)} className="w-12 border-none p-1 rounded-lg text-center font-extrabold text-indigo-600 focus:ring-2 focus:ring-indigo-500 text-sm bg-white shadow-sm"/>
                                                </div>
                                                <div className="h-10 w-px bg-slate-200"></div>
                                                <span className="font-extrabold text-slate-700 text-base truncate tracking-tight">{s.name}</span>
                                            </div>
                                            <button type="button" onClick={()=>handleDeleteSubjectFromLevel(s.id, activeLevelTab)} className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-2.5 rounded-xl transition-colors"><Trash2 size={18}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
